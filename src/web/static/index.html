<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FPLayCity</title>
<style>
:root {
  --bg: #f7f7f8; --panel: #ffffff; --ink: #16181d; --muted: #6b7280; --line: #e3e5e9;
  --accent: #1f6feb; --good: #1a7f37; --bad: #cf222e; --warn: #9a6700;
  --chip: #eef1f6; --mine: #dcfce7; --other: #f3f4f6;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d1117; --panel: #161b22; --ink: #e6edf3; --muted: #8b949e; --line: #30363d;
    --accent: #58a6ff; --good: #3fb950; --bad: #f85149; --warn: #d29922;
    --chip: #21262d; --mine: #12351f; --other: #21262d;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 13px/1.45 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
}
a { color: var(--accent); text-decoration: none; }
header {
  position: sticky; top: 0; z-index: 20; background: var(--panel);
  border-bottom: 1px solid var(--line); padding: 8px 14px;
  display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
}
header h1 { font-size: 14px; margin: 0 8px 0 0; letter-spacing: .02em; }
nav { display: flex; gap: 4px; }
nav button {
  background: none; border: 1px solid transparent; border-radius: 6px;
  padding: 5px 11px; color: var(--muted); cursor: pointer; font: inherit;
}
nav button.on { background: var(--chip); color: var(--ink); border-color: var(--line); }
select, input, button.act {
  background: var(--panel); color: var(--ink); border: 1px solid var(--line);
  border-radius: 6px; padding: 5px 8px; font: inherit;
}
button.act { cursor: pointer; }
button.act:hover { border-color: var(--accent); }
button.act.on { background: var(--chip); border-color: var(--accent); }
.modes { display: flex; gap: 4px; }
.spacer { flex: 1; }
.muted { color: var(--muted); }
main { padding: 14px; }
.cards { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.card {
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  padding: 9px 12px; min-width: 150px;
}
.card .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.card .v { font-size: 17px; font-weight: 600; margin-top: 2px; }
.card .s { font-size: 11px; color: var(--muted); }
table { width: 100%; border-collapse: collapse; background: var(--panel); }
/* Both axes scroll inside the wrapper so that `position: sticky` on the header row is
   scoped to a container that actually scrolls vertically. With `overflow-x` alone the
   computed `overflow-y` is also `auto`, and a header stuck to the viewport ends up drawn
   over the first row. */
.tablewrap {
  overflow: auto; border: 1px solid var(--line); border-radius: 8px;
  max-height: calc(100vh - 270px); min-height: 240px;
}
th, td { padding: 5px 8px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
th:nth-child(-n+4), td:nth-child(-n+4) { text-align: left; }
th {
  position: sticky; top: 0; background: var(--panel); z-index: 5; cursor: pointer;
  font-weight: 600; font-size: 11px; text-transform: uppercase; color: var(--muted);
  letter-spacing: .04em; user-select: none;
}
th:hover { color: var(--ink); }
tbody tr:hover { background: var(--chip); }
tbody tr.taken { opacity: .42; }
tbody tr.mine td:first-child { box-shadow: inset 3px 0 0 var(--good); }
tr.tierbreak td { border-top: 2px solid var(--accent); }
.name { font-weight: 600; cursor: pointer; }
.name:hover { color: var(--accent); }
.pos { display: inline-block; width: 30px; font-size: 11px; color: var(--muted); }
.flag {
  display: inline-block; font-size: 10px; padding: 1px 5px; border-radius: 4px;
  background: var(--chip); color: var(--muted); margin-left: 4px;
}
.flag.warn { color: var(--warn); }
.flag.good { color: var(--good); }
.pos-good { color: var(--good); }
.pos-bad { color: var(--bad); }
#panel {
  position: fixed; top: 0; right: 0; width: min(680px, 100%); height: 100%;
  background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto;
  z-index: 40; padding: 16px; display: none; box-shadow: -8px 0 24px rgba(0,0,0,.14);
}
#panel.open { display: block; }
#panel h2 { margin: 0 0 2px; font-size: 18px; }
.close { position: absolute; top: 12px; right: 14px; }
.bar { height: 15px; background: var(--accent); border-radius: 3px; min-width: 1px; }
.bar.neg { background: var(--bad); }
.waterfall td:nth-child(2) { width: 55%; }
.strip { display: flex; flex-wrap: wrap; gap: 2px; margin: 6px 0; }
.cell {
  width: 15px; height: 15px; border-radius: 3px; background: var(--chip);
  font-size: 8px; text-align: center; line-height: 15px; color: var(--muted);
}
.cell.hit { background: var(--good); color: #fff; }
.cell.dnp { opacity: .3; }
.cell.sub { border: 1px dashed var(--muted); }
section.block { margin-top: 18px; }
section.block > h3 {
  font-size: 11px; text-transform: uppercase; letter-spacing: .05em;
  color: var(--muted); margin: 0 0 6px; font-weight: 600;
}
table.gamelog { margin-top: 8px; font-variant-numeric: tabular-nums; }
table.gamelog th, table.gamelog td { padding: 3px 6px; }
table.gamelog th:nth-child(-n+2), table.gamelog td:nth-child(-n+2) { text-align: left; }
table.gamelog tr.extra { display: none; }
table.gamelog.showall tr.extra { display: table-row; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 12px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }
.notice {
  background: var(--chip); border: 1px solid var(--line); border-left: 3px solid var(--warn);
  border-radius: 6px; padding: 9px 12px; margin-bottom: 12px;
}
.err { border-left-color: var(--bad); }
textarea {
  width: 100%; min-height: 54px; background: var(--bg); color: var(--ink);
  border: 1px solid var(--line); border-radius: 6px; padding: 6px; font: inherit;
}
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
/* Anything with an explanation behind it is underlined with dots and answers on hover. */
.hint { border-bottom: 1px dotted currentColor; cursor: help; }
.glossary { display: grid; grid-template-columns: 170px 1fr; gap: 6px 16px; margin: 0; font-size: 12px; }
.glossary dt { font-weight: 600; }
.glossary dd { margin: 0; color: var(--muted); }
.glossary code { background: var(--chip); border-radius: 3px; padding: 0 3px; }
</style>
</head>
<body>
<header>
  <h1>FPLayCity</h1>
  <nav id="nav"></nav>
  <span class="spacer"></span>
  <label class="muted">run <select id="runsel"></select></label>
  <span id="ctx" class="muted"></span>
</header>
<main id="main"></main>
<div id="panel"><button class="act close" onclick="closePanel()">close</button><div id="panelbody"></div></div>

<script>
const S = {
  view: 'draft', config: null, runs: [], runId: null,
  board: null, sort: null, desc: true, gameFor: 'draft', cmpA: null, cmpB: null,
  filters: { pos: '', team: '', q: '', hideTaken: false, live: true, picks: null, squad: 'all' },
  // One set of horizons for the whole app. Changing them on the FPL board changes them on the
  // waivers page too, on purpose: they are the same three questions about the same weeks.
  horizons: [1, 3, 5], sortHorizon: 3,
  waivers: { includeLocked: false, onlyGains: false,
             board: null, pos: '', q: '', sort: 'rank', desc: true,
             mode: 'claims', scope: 'available', psort: 'points', pdesc: true },
  // The classic-FPL side of the same question. `freeTransfers` is not published by the API, so
  // it is the manager's to state; it moves `net` and never `gain`.
  transfers: { board: null, pos: '', q: '', sort: 'rank', desc: true,
               freeTransfers: 1, onlyWorthHit: false },
};

const api = async (path) => {
  const res = await fetch('/api' + path);
  const body = await res.json().catch(() => ({ detail: res.statusText }));
  if (!res.ok) throw new Error(body.detail || 'request failed');
  return body;
};
const post = async (path, payload) => {
  const res = await fetch('/api' + path, {
    method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(payload),
  });
  const body = await res.json().catch(() => ({ detail: res.statusText }));
  if (!res.ok) throw new Error(body.detail || 'request failed');
  return body;
};

// A <template> is used rather than a <div> because the HTML parser silently discards
// <thead>/<tr>/<th> when they are assigned to a div's innerHTML without a table around them,
// which turns a whole table into one run of concatenated text.
const el = (html) => {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
};
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const n1 = (v) => (v == null ? '–' : Number(v).toFixed(1));
const n2 = (v) => (v == null ? '–' : Number(v).toFixed(2));
const pct = (v) => (v == null ? '–' : Math.round(v * 100) + '%');
const signed = (v, digits = 1) => (v == null ? '–' : (v > 0 ? '+' : '') + Number(v).toFixed(digits));

/* ------------------------------------------------------------------ help
   One place where every column and every number is explained in plain words.
   `[label, explanation]` per key. The key is the column key wherever there is one, so a
   table header can look up its own hint. Anything added to a table must be added here too:
   an unexplained column is the same problem as an unexplained number. */
const HELP = {
  /* board columns */
  rank: ['#', 'Place on this list. On the draft board, click the number to mark a player: available → mine → taken by someone else.'],
  web_name: ['Player', 'Click the name to open the full breakdown of where the points come from.'],
  team: ['Club', 'The club the player belongs to right now.'],
  position: ['Pos', 'GKP goalkeeper, DEF defender, MID midfielder, FWD forward. Position decides how much each action is worth.'],
  vorp: ['VORP', 'Value Over Replacement Player: projected points minus the points of the best player in the same position who will STILL be free at the end of the draft. It is how you compare a forward with a midfielder, because scarcity differs by position. It is deliberately stable: taking a star removes one player from the pool and one pick from those still to come, so the last man standing — and therefore VORP — does not move. Use Δnext for what a single pick costs you.'],
  drop_next: ['Δnext', 'Points this player has over the NEXT available player in his position. This is the cost of not taking him: a big number means the position falls off a cliff below him, a small number means someone almost as good is still there. Live draft mode only, and it rises as the players below him are taken.'],
  wait_cost: ['Cost of waiting', 'What each position costs you if you spend this pick elsewhere: the best player available now, minus the best one still there when your turn comes round again. It assumes the picks in between go to the highest VORP on the board, so it is a floor — if your rivals reach for favourites, your target is more likely to survive, not less.'],
  points: ['Proj', 'Total points we expect over the whole gameweek range of the run, shown at the top of the page. It is the sum of all the component columns, and it does not follow the horizon you are deciding on.'],
  points_per_gameweek: ['per GW', 'Projected points divided by the number of matches in the range. Useful when clubs play a different number of games.'],
  horizon_points: ['Horizon points', 'Projected points over the first N gameweeks of the run, added up fixture by fixture — a double gameweek counts twice, a blank counts as zero. Click the column to rank the whole board on it.'],
  horizon_per_gameweek: ['per GW at the horizon', 'Points at the deciding horizon divided by the number of gameweeks in it, so a blank drags the average down. It answers "what does he score in a normal week", which the run total cannot.'],
  horizon_per_million: ['pts/£ at the horizon', 'Points at the deciding horizon divided by price: value for money over the weeks you are deciding on, not over the whole run. A cheap player with a good next three fixtures shows up here and nowhere else.'],
  price: ['£', 'Current FPL price, in millions. Only matters in classic FPL — in a draft nothing costs money.'],
  points_per_million: ['pts/£ over the run', 'Projected points divided by price: value for money over the run\'s whole range. The FPL board shows the horizon version of this instead, because the weeks you are deciding on are rarely all ten.'],
  ownership: ['Own%', 'Share of FPL managers who own this player. A low number with high points is a differential.'],

  /* points components */
  appearance: ['Appearance', 'Points just for playing: 1 point for any minutes, 2 points for 60 minutes or more. Each is multiplied by how likely it is.'],
  goals: ['Goals', 'Expected goals per 90 minutes × expected 90s played × fixture difficulty × points per goal (6 for GKP/DEF, 5 for MID, 4 for FWD).'],
  assists: ['Assists', 'Expected assists per 90 minutes × expected 90s played × fixture difficulty × 3 points.'],
  clean_sheets: ['Clean sheets', 'Chance of playing 60+ minutes × chance the club concedes nothing × 4 points (GKP/DEF) or 1 point (MID). Forwards get nothing.'],
  goals_conceded: ['Goals conceded', 'Minus 1 point for every 2 goals the club concedes, for goalkeepers and defenders only. Always negative.'],
  saves: ['Saves', '1 point per 3 saves, for goalkeepers. Counted in whole steps: 3.0 expected saves is worth 0.66 points, not 1, because 2 saves score nothing.'],
  defensive_contribution: ['DC', 'Defensive contribution: 2 points in a match where the player makes enough defensive actions — 10 for defenders (tackles plus blocks, interceptions, clearances), 12 for everyone else (those plus recoveries). Goalkeepers cannot score it. Here it is: chance of starting × how often he clears the bar × 2.'],
  bonus: ['Bonus', 'The 1–3 extra points the best performers get in each match. Taken from his rate last season, not yet predicted from the match itself.'],
  cards: ['Cards', 'Minus 1 point per yellow card and minus 3 per red, at his rate last season. Always negative.'],

  /* playing time */
  p_start: ['Start%', 'Chance the player starts the next match. Last season\'s share of starts blended with pre-season line-ups, then multiplied by availability (injury, suspension, or not in the squad).'],
  role_share: ['Role', 'How big a role he has in the squad, before injuries: the blend of last season and pre-season, with no availability applied yet.'],
  expected_minutes: ['Expected minutes', 'Average minutes we expect in one match, counting the chance he starts, the chance he is subbed off, and the chance he comes on from the bench.'],
  preseason_weight: ['Pre-season weight', 'How much of the role comes from pre-season rather than last season. Normally 0.60, but lowered when the club has little pre-season evidence stored. A friendly counts 0.20 against a real match, because managers rotate freely in friendlies.'],
  transfer_multiplier: ['Transfer discount', 'A cut applied to last season\'s start share when a player has changed club, because it describes the squad he left. Players who moved started 0.48 of early matches against 0.74 for those who stayed, and 0.40 when the new club is clearly stronger.'],
  availability: ['Availability', 'FPL\'s own flag turned into a number: fit players 1.0, doubts lower, injured or suspended 0.'],

  /* evidence and trust */
  shrinkage: ['Shrinking', 'When there is little evidence about a player we pull his number toward the average for his position. More minutes or more starts mean we trust his own record more. This is why "n" matters.'],
  dc_hit_rate: ['DC hit', 'Share of his starts where he reached the defensive threshold. Pulled toward the position average when the sample is small.'],
  dc_sample: ['n', 'Number of stored starts behind the DC hit rate. A small n means the percentage next to it is mostly the position average, not this player.'],
  sample_minutes: ['Minutes of evidence', 'Premier League minutes behind his scoring rates. Zero means the rates are the position average and the projection is a placeholder.'],

  /* fixtures and clubs */
  attack_multiplier: ['Attack ×', 'How easy the fixture is for attackers. Above 1.00 means a weaker opponent than average, below 1.00 a stronger one. Measured from last season\'s results, not from FPL\'s pre-season strength fields, which are all zero in August.'],
  clean_sheet_probability: ['CS%', 'Chance the club concedes no goals in this match, from both clubs\' scoring and conceding rates.'],
  replacement: ['Replacement level', 'The points you can get at this position for free. With 4 managers each starting 1 GKP, 4 DEF, 4 MID and 2 FWD, it is the best player still left once every starting slot is filled. VORP is measured against this line, and it rises as players are drafted.'],
  tier: ['Tier', 'Players are grouped where VORP drops sharply. A blue line means the next player is clearly worse — pick now, or accept the drop.'],
  live: ['Live draft mode', 'Recalculates replacement level and VORP against the players still available, so the board reacts as picks come off the table. Only VORP, # and tier move — Proj and the component columns come from the saved run and never change. Marking a player "mine" or "other" has the same effect on the numbers: both mean he is gone. With this off, nothing recalculates.'],

  /* one match at a time */
  match_xg: ['xG', 'Expected goals from the chances he had in that match. 0.5 means the chances were worth half a goal — better evidence of how he played than whether the ball went in.'],
  match_xa: ['xA', 'Expected assists: the chances he created, valued by how likely each was to be scored.'],
  match_xgc: ['xGC', 'Expected goals conceded by his club while he was on the pitch. High xGC with a clean sheet means the defence was lucky, not solid.'],

  /* my classic-FPL squad */
  my_squad: ['My squad', 'The fifteen players your classic-FPL team held at the end of the last gameweek that has started. FPL publishes a squad only after its deadline, so this is never the upcoming week: any transfer you have already made for the next gameweek is not in it, and cannot be — the API does not expose it.'],
  squad_scope: ['Show', 'Which players the board lists. All players is everyone; my squad is your fifteen, for deciding who to drop; not my squad is everyone else, which is your transfer market.'],
  squad_slot: ['Slot', 'Where the player sat in your last submitted team: 1–11 started, 12–15 were on the bench in that order. C is the captain and V the vice — both from last gameweek, not a recommendation.'],
  fpl_squad_points: ['Squad value', 'What your fifteen would score over the horizon, picking the best legal eleven each gameweek — 1 keeper, at least 3 defenders, at least 1 forward. It does not double a captain (who you will captain in three weeks is not knowable, and the armband on file is last gameweek\'s) and does not model auto-subs, so it is the value of the squad rather than a predicted score.'],

  /* waivers */
  horizon: ['Horizon', 'How many gameweeks ahead a number looks. A 3-gameweek horizon adds up the next three matches only. The projection reaches 10 gameweeks, so that is the longest you can ask for.'],
  squad_points: ['Squad points', 'What your current fifteen would score over the horizon, picking the best legal eleven each gameweek — 1 keeper, at least 3 defenders, at least 1 forward. Every gain on this page is measured against this number.'],
  waiver_gain: ['Gain', 'Extra points your whole squad would score over the horizon if you signed this player and dropped the one shown next to him. It is not his points — it is the difference he makes to your best eleven, gameweek by gameweek. Signing a great player who would sit on your bench gains almost nothing, and that shows up here as a number near zero.'],
  waiver_out: ['Drop', 'The player of yours it is best to release for him. Always the same position — the game only lets you swap an unsigned player for one of yours in the same position — and always the one that gains most at the horizon you are deciding on, so the other horizons score that same pair rather than their own best pair.'],
  starts: ['Starts', 'How many of the horizon\'s gameweeks this player of yours would make your best eleven. 0 means he is bench cover, so upgrading him is worth more than his points suggest.'],
  blanks: ['Blank', 'Gameweeks in the horizon where his club does not play. Those weeks he scores nothing and your bench covers him.'],
  transfer_gain: ['Gain', 'Extra points your whole fifteen would score over the horizon if you signed this player and sold the one shown next to him, picking the best legal eleven each week. It is not the difference between the two players: signing someone who would sit on your bench gains almost nothing, and a good signing can be worth more than the gap to the man he replaces because the eleven reshapes around him.'],
  transfer_net: ['Net', 'Gain minus the points a hit costs. One transfer is free if you have a free transfer in hand, so net equals gain; beyond that the game charges 4 points each. This is the number to decide on — most transfers found here are worth less than a hit.'],
  transfer_out: ['Sell', 'The player of yours it is best to sell for him. Always the same position, because a classic squad must stay 2 keepers, 5 defenders, 5 midfielders and 3 forwards — and always the pair that gains most at the horizon you are deciding on.'],
  transfer_budget: ['Budget', 'What you can spend on the incoming player: the money in the bank plus the selling price of the one you drop. Selling prices here are approximated by current prices, because the public API does not publish what you paid — a player who has risen sells for less than he costs, so this is an upper bound.'],
  transfer_spare: ['Spare', 'Money left over after the swap, on the same approximation as the budget.'],
  free_transfers: ['Free transfers', 'How many transfers cost you nothing this week. FPL does not publish this, so it is yours to set — it changes net, never gain.'],
  claimable: ['Claimable', 'Whether you can actually sign him now. Free agent — nobody owns him. Locked — he was added to the game or dropped by another squad too recently, so he cannot be claimed until the next deadline.'],
  waiver_pick: ['Waiver order', 'Your priority when two managers claim the same player. Lower is better, and it is not modelled here: every suggestion assumes your claim goes through.'],
  ownership_label: ['Owner', 'Which squad in your league holds this player. Only free agents can be claimed; anyone owned needs a trade.'],
  player_list: ['All players', 'The plain board: every projected player with his points at each horizon, ranked by the horizon you are deciding on. No swap arithmetic — use it to pick your eleven, or to see who is out there before trusting the claims list.'],
  owner_scope: ['Who to show', 'Available to me — your own players plus the free agents, which is everyone you could field or sign. Mine — your fifteen only, for picking a team. All — including your rivals\' squads, which you can only reach through a trade. Free agents — the claim pool on its own.'],

  /* runs and scoring */
  run: ['Run', 'One saved projection. Runs are never changed after they are written, so you can always compare two of them and see exactly what a model change moved.'],
  method: ['Method', 'The named set of model settings used for this run. Controls differ from the baseline in exactly one setting, so a comparison means something.'],
  rank_delta: ['Δrank', 'How many places the player moved between the two runs. Positive means he moved up in run B.'],
  points_delta: ['Δpts', 'Change in projected points between the two runs.'],
  brier: ['Brier score', 'How good the start probabilities were. Take the difference between the predicted chance and what happened (1 or 0), square it, average it. 0 is perfect, 0.25 is a coin flip. Lower is better.'],
  mae: ['MAE', 'Mean absolute error: the average size of the miss in points, ignoring whether it was too high or too low. Lower is better.'],
  your_p_start: ['your p_start', 'The start chance you think is right, saved next to the model\'s, so the disagreement can be scored later.'],
};

/* Board flags. `[label, style, explanation]` - the chip next to a player's name. */
const FLAGS = {
  penalties: ['pens', 'good', 'First-choice penalty taker at his club.'],
  direct_freekicks: ['fk', 'good', 'First-choice direct free-kick taker.'],
  corners: ['corners', 'good', 'First-choice corner taker.'],
  promoted_club: ['promoted', 'warn', 'The club just came up from the Championship. We rate its attack at 0.73 of average until it proves otherwise.'],
  new_club: ['new club', 'warn', 'He changed club since last season, so last season\'s start share is discounted.'],
  no_prior_season: ['no PL record', 'warn', 'No Premier League season on record. His rates are the position average scaled by club strength — a placeholder, not a projection.'],
  no_match_history: ['no history', 'warn', 'No stored match-by-match rows, so hit rates and minutes per start fall back to position defaults.'],
  club_change_unpriced: ['move unpriced', 'warn', 'He moved, but we cannot rate the club he left (usually a foreign league), so no club-change adjustment was applied.'],
  no_preseason_start: ['0 friendlies', 'warn', 'He was in the pre-season squad but started none of the matches. That is real evidence, not a gap: of 12 established players (0.60-0.80 start share) who did this last year, 11 started none of GW1-5.'],
  preseason_role_drop: ['role drop?', 'warn', 'Last season says first choice, pre-season says benched. The model keeps his prior — for a nailed starter, pre-season absence is usually rest — so if a new signing has actually taken his place, this is where the model will be wrong. Worth reading the team news yourself.'],
};

const helpText = (key) => (HELP[key] ? HELP[key][1] : null);
const tip = (key) => (helpText(key) ? ` title="${esc(helpText(key))}"` : '');
/** A label with a dotted underline that explains itself on hover. */
const hint = (key, label) => {
  const text = helpText(key);
  const shown = esc(label != null ? label : (HELP[key] ? HELP[key][0] : key));
  return text ? `<span class="hint" title="${esc(text)}">${shown}</span>` : shown;
};

const VIEWS = [
  ['draft', 'Draft board'], ['waivers', 'Waivers'], ['fpl', 'FPL board'],
  ['transfers', 'Transfers'],
  ['compare', 'Compare runs'], ['calibration', 'Calibration'], ['feedback', 'Feedback'],
  ['glossary', 'Glossary'],
];

function renderNav() {
  document.getElementById('nav').innerHTML = VIEWS
    .map(([id, label]) => `<button class="${S.view === id ? 'on' : ''}" onclick="go('${id}')">${label}</button>`)
    .join('');
  document.getElementById('ctx').textContent =
    `${S.config.season} · GW${S.config.next_gameweek}`;
}

function go(view) { S.view = view; location.hash = '#/' + view; render(); }

function isBoard() { return S.view === 'draft' || S.view === 'fpl'; }
function game() {
  if (isBoard()) return S.view;
  // Transfers are a classic-FPL question by definition; waivers a draft one. Only the shared
  // screens (compare, calibration, feedback) follow the gameFor selector.
  if (S.view === 'transfers') return 'fpl';
  return S.gameFor;
}

async function loadRuns() {
  const g = game();
  S.runs = (await api('/runs?game=' + g)).runs;
  const sel = document.getElementById('runsel');
  sel.innerHTML = S.runs.map((r) =>
    `<option value="${r.run_id}">${esc(r.method)} · ${esc(r.created_at.slice(5, 16).replace('T', ' '))}${r.label ? ' · ' + esc(r.label) : ''}</option>`
  ).join('') || '<option value="">no runs</option>';
  if (!S.runs.find((r) => r.run_id === S.runId)) {
    // Newest run of the default method, falling back to the newest of anything. Otherwise
    // generating a control makes the control the default board, which is the one view nobody
    // should be making decisions from.
    const preferred = S.runs.find((r) => r.method === S.config.default_method);
    S.runId = (preferred || S.runs[0] || {}).run_id || null;
  }
  sel.value = S.runId || '';
  sel.onchange = () => { S.runId = sel.value; render(); };
}

async function render() {
  renderNav();
  await loadRuns();
  const main = document.getElementById('main');
  main.innerHTML = '<p class="muted">loading…</p>';
  try {
    if (isBoard()) await renderBoard(main);
    else if (S.view === 'waivers') await renderWaivers(main);
    else if (S.view === 'transfers') await renderTransfers(main);
    else if (S.view === 'compare') await renderCompare(main);
    else if (S.view === 'calibration') await renderCalibration(main);
    else if (S.view === 'glossary') renderGlossary(main);
    else await renderFeedback(main);
  } catch (err) {
    main.innerHTML = `<div class="notice err"><b>${esc(err.message)}</b></div>`;
  }
}

/* ------------------------------------------------------------- horizons */

/* Three horizons, one deciding horizon, shared by the boards and the waivers page. The inputs
   are capped at the selected run's length as well as at HORIZON_LIMIT, because a horizon the run
   has no fixtures for is a 400, not a longer view. */

function runLength() {
  const run = S.runs.find((r) => r.run_id === S.runId);
  return run ? run.gameweek_to - run.gameweek_from + 1 : S.config.waivers.horizon_limit;
}

/** The horizons we can actually ask this run for, in order. */
function horizons() {
  const cap = Math.min(S.config.waivers.horizon_limit, runLength());
  const wanted = [...new Set(S.horizons.map((h) => Math.min(Math.max(1, h), cap)))].sort((a, b) => a - b);
  return wanted;
}

function decidingHorizon() {
  const list = horizons();
  return list.includes(S.sortHorizon) ? S.sortHorizon : list[Math.floor(list.length / 2)];
}

function horizonInputs() {
  const cap = Math.min(S.config.waivers.horizon_limit, runLength());
  return S.horizons.map((h, i) =>
    `<input class="wh" data-i="${i}" type="number" min="1" max="${cap}"
      value="${h}" style="width:52px" title="Gameweeks this column adds up, counted from the start of the run. At most ${cap} for this run.">`).join(' ');
}

function horizonOptions() {
  return horizons().map((h) =>
    `<option value="${h}" ${h === decidingHorizon() ? 'selected' : ''}>${h} GW</option>`).join('');
}

/** The label, the three boxes and the "decide on" select, as one span. */
function horizonFields() {
  return `<span class="muted">${hint('horizon', 'horizons')}</span> ${horizonInputs()}
    <span class="muted">decide on</span> <select class="hsort">${horizonOptions()}</select>`;
}

function wireHorizons(bar) {
  bar.querySelectorAll('.wh').forEach((input) => {
    input.onchange = (e) => {
      const next = S.horizons.slice();
      next[Number(e.target.dataset.i)] = Math.max(1, Number(e.target.value) || 1);
      S.horizons = next;
      if (!horizons().includes(S.sortHorizon)) S.sortHorizon = decidingHorizon();
      render();
    };
  });
  const sort = bar.querySelector('.hsort');
  if (sort) sort.onchange = (e) => { S.sortHorizon = Number(e.target.value); render(); };
}

/* ---------------------------------------------------------------- boards */

const DRAFT_COLS = [
  ['rank', '#'], ['web_name', 'Player'], ['team', 'Club'], ['position', 'Pos'],
  ['vorp', 'VORP'], ['drop_next', 'Δnext'], ['points', 'Proj'], ['points_per_gameweek', 'per GW'],
  ['appearance', 'Appear'], ['goals', 'Goals'], ['assists', 'Assists'],
  ['clean_sheets', 'CS'], ['defensive_contribution', 'DC'], ['bonus', 'Bonus'],
  ['p_start', 'Start%'], ['dc_hit_rate', 'DC hit'], ['dc_sample', 'n'],
];
/* Classic FPL, with a horizon column per requested horizon. `per GW` and `pts/£` follow the
   deciding horizon; `Proj` and every component column are totals over the whole run, because the
   artifact stores points per fixture but components only in total. */
function fplCols() {
  const cols = [['rank', '#'], ['web_name', 'Player'], ['team', 'Club'], ['position', 'Pos']];
  (S.board ? S.board.horizons : horizons()).forEach(
    (h) => cols.push([`points${h}`, `${h} GW`, 'horizon_points']));
  cols.push(
    ['per_gameweek', 'per GW', 'horizon_per_gameweek'], ['price', '£'],
    ['per_million', 'pts/£', 'horizon_per_million'], ['ownership', 'Own%'],
    ['p_start', 'Start%'], ['points', 'Proj'],
    ['appearance', 'Appear'], ['goals', 'Goals'], ['assists', 'Assists'],
    ['clean_sheets', 'CS'], ['defensive_contribution', 'DC'], ['bonus', 'Bonus'],
    ['dc_hit_rate', 'DC hit'], ['dc_sample', 'n'],
  );
  return cols;
}

function boardCols() { return S.view === 'draft' ? DRAFT_COLS : fplCols(); }

/** Which horizon a `points3`-style column key means, or null for every other column. */
const horizonOf = (key) => (/^points\d+$/.test(key) ? Number(key.slice(6)) : null);

const cellValue = (row, key) => {
  const horizon = horizonOf(key);
  if (horizon) return row.horizon_points ? row.horizon_points[horizon] : null;
  if (key === 'per_gameweek') return row.horizon_per_gameweek[S.board.sort_horizon];
  if (key === 'per_million') return row.horizon_per_million[S.board.sort_horizon];
  if (key in row) return row[key];
  if (row.components && key in row.components) return row.components[key];
  if (key === 'p_start') return row.p_start;
  return null;
};

async function renderBoard(main) {
  if (!S.runId) {
    main.innerHTML = `<div class="notice"><b>No ${S.view} runs yet.</b><br>
      Generate one: <code>uv run -m src.fpl.project --game ${S.view}</code></div>`;
    return;
  }
  const live = S.view === 'draft' && S.filters.live;
  const picks = S.filters.picks == null ? '' : `&picks_until_next_turn=${S.filters.picks}`;
  S.board = await api(
    `/board?game=${S.view}&run_id=${encodeURIComponent(S.runId)}&live=${live}${picks}`
    + `&horizons=${horizons().join(',')}&sort_horizon=${decidingHorizon()}`);
  const head = S.board.run;
  const cols = boardCols();
  // Rank on an FPL board is the deciding horizon's rank, so leave the sort on it: sorting by the
  // run total while the numbers next to it cover three gameweeks is how you misread a board. A
  // sort carried over from the other board (VORP, say) is dropped rather than applied invisibly to
  // a table that has no such column.
  if (!S.sort || !cols.some(([key]) => key === S.sort)) {
    S.sort = S.view === 'draft' ? 'vorp' : 'rank';
    S.desc = true;
  }

  main.innerHTML = '';
  main.append(el(`<div class="notice" style="border-left-color:var(--accent)">
    <b>${esc(head.method.name)}</b> · GW${head.gameweek_from}–${head.gameweek_to} ·
    generated ${esc(head.created_at.replace('T', ' '))}
    ${head.label ? '· ' + esc(head.label) : ''}<br>
    <span class="muted">${esc(head.method.notes)}</span>
  </div>`));

  if (S.view === 'draft') {
    if (S.board.waiting) main.append(waitingCards());
    main.append(replacementCards());
  } else {
    main.append(horizonNote());
    const note = squadNote();
    if (note) main.append(note);
    main.append(fplCards());
  }
  main.append(filterBar());
  main.append(boardTable(cols));
}

/* What the horizon columns cover, and what they deliberately do not. */
function horizonNote() {
  const b = S.board;
  const last = b.gameweeks[b.sort_horizon - 1];
  const window = b.sort_horizon === 1 ? `GW${b.gameweeks[0]}` : `GW${b.gameweeks[0]}–${last}`;
  const stale = b.gameweeks[0] !== S.config.next_gameweek;
  return el(`<div class="notice"${stale ? ' style="border-left-color:var(--warn)"' : ''}>
    Deciding on <b>${b.sort_horizon} GW</b> (${window}), counted from the start of the run.
    Click another horizon column to decide on it.
    ${stale ? `<b>This run starts at GW${b.gameweeks[0]}, but the next gameweek is
      GW${S.config.next_gameweek}</b>, so "1 GW" means GW${b.gameweeks[0]}. Generate a run from the
      right gameweek: <code>./run.sh -m src.fpl.project --game fpl --gw-from
      ${S.config.next_gameweek} --gw-to ${S.config.next_gameweek + 9}</code>` : ''}
    <span class="muted">Proj and every component column (Appear to Bonus) are totals over the whole
      run, GW${b.run.gameweek_from}–${b.run.gameweek_to} — the run stores points per fixture but
      components only in total, so they are not sliced to the horizon.</span></div>`);
}

function fplCards() {
  const rows = S.board.players;
  const h = S.board.sort_horizon;
  const at = (row) => row.horizon_points[h];
  const value = rows.slice().sort((a, b) => b.horizon_per_million[h] - a.horizon_per_million[h])[0];
  const differential = rows.filter((r) => r.ownership < 5).sort((a, b) => at(b) - at(a))[0];
  const top = rows.slice().sort((a, b) => at(b) - at(a))[0];
  const wrap = el('<div class="cards"></div>');
  wrap.append(el(`<div class="card"><div class="k">${hint('horizon_per_million', 'Best value')}</div>
    <div class="v">${esc(value.web_name)}</div>
    <div class="s">${n2(value.horizon_per_million[h])} pts per £m · £${n1(value.price)}
      · over ${h} GW</div></div>`));
  wrap.append(el(`<div class="card"><div class="k">${hint('horizon_points', 'Top projected')}</div>
    <div class="v">${esc(top.web_name)}</div>
    <div class="s">${n1(at(top))} pts over ${h} GW · £${n1(top.price)}</div></div>`));
  if (differential) {
    wrap.append(el(`<div class="card"><div class="k"><span class="hint" title="The highest projected player owned by fewer than 5% of managers, over the horizon you are deciding on. If he scores, you gain on almost everyone.">Top differential</span></div>
      <div class="v">${esc(differential.web_name)}</div>
      <div class="s">${n1(at(differential))} pts over ${h} GW · ${n1(differential.ownership)}% owned</div></div>`));
  }
  wrap.append(el(`<div class="card"><div class="k">Players</div>
    <div class="v">${rows.length}</div>
    <div class="s">run GW${S.board.run.gameweek_from}–${S.board.run.gameweek_to}</div></div>`));
  const squad = squadCard();
  if (squad) wrap.prepend(squad);
  return wrap;
}

/* Our own fifteen: what they are worth over the deciding horizon, and which gameweek they are. */
function squadCard() {
  const sq = S.board.squad;
  if (!sq) return null;
  const h = S.board.sort_horizon;
  const value = sq.points ? n1(sq.points[h]) : '–';
  const missing = sq.missing.length
    ? ` · ${sq.missing.length} not projected` : '';
  return el(`<div class="card" style="border-color:var(--good)">
    <div class="k">${hint('fpl_squad_points', esc(sq.entry_name))}</div>
    <div class="v">${value}</div>
    <div class="s">best XI over ${h} GW · ${hint('my_squad', 'squad as at GW' + sq.gameweek)}${missing}</div>
  </div>`);
}

/* Either how to connect a team, or what the connected one cannot know yet. Both are one line. */
function squadNote() {
  const entry = S.config.fpl_entry;
  const sq = S.board.squad;
  if (sq) {
    const behind = S.board.gameweeks[0] - sq.gameweek;
    if (behind <= 1) return null;
    return el(`<div class="notice" style="border-left-color:var(--warn)">
      <b>Your stored squad is from GW${sq.gameweek}, but this run starts at
      GW${S.board.gameweeks[0]}.</b> Gameweeks in between have been played and your team may have
      changed. Refresh it: <code>./run.sh -m src.fpl.squad --refresh</code></div>`);
  }
  if (entry && entry.note) {
    return el(`<div class="notice"><b>${esc(entry.entry_name)}</b> is connected but has no
      published squad yet. ${esc(entry.note)}</div>`);
  }
  return el(`<div class="notice"><span class="muted">No classic-FPL team connected, so the board
    cannot tell your players from everyone else's. Connect yours once:
    <code>./run.sh -m src.fpl.squad --entry &lt;your entry id&gt;</code> — the id is the number in
    your team page's address on fantasy.premierleague.com.</span></div>`);
}

/** What this pick costs at each position, which is the question you face on the clock. */
function waitingCards() {
  const w = S.board.waiting;
  const wrap = el('<div class="cards"></div>');
  const ordered = Object.entries(w.positions)
    .sort((a, b) => (b[1].cost ?? -1) - (a[1].cost ?? -1));
  ordered.forEach(([pos, c]) => {
    const urgent = c.cost != null && c.cost >= 3;
    wrap.append(el(`<div class="card">
      <div class="k">${hint('wait_cost', pos + ' if you wait')}</div>
      <div class="v ${urgent ? 'pos-bad' : ''}">${c.cost == null ? 'pool empty' : '−' + n1(c.cost)}</div>
      <div class="s">${esc(c.best_name)} ${n1(c.best)}
        ${c.survives ? '<b>should last</b>' : '→ ' + esc(c.then_name || '–') + ' ' + n1(c.then)}</div>
    </div>`));
  });
  const bar = el(`<div class="row" style="margin:-4px 0 10px">
    <span class="muted">${hint('wait_cost', 'Cost of waiting')} assumes the next
      <input id="wpicks" type="number" min="0" max="60" value="${w.picks_until_next_turn}" style="width:56px">
      picks go to the highest VORP on the board.</span></div>`);
  setTimeout(() => {
    bar.querySelector('#wpicks').onchange = (e) => {
      S.filters.picks = Math.max(0, Number(e.target.value) || 0);
      render();
    };
  });
  const holder = el('<div></div>');
  holder.append(wrap, bar);
  return holder;
}

function replacementCards() {
  const wrap = el('<div class="cards"></div>');
  const levels = S.board.replacement_level;
  Object.keys(levels).forEach((pos) => {
    const lv = levels[pos];
    wrap.append(el(`<div class="card">
      <div class="k">${hint('replacement', pos + ' replacement')}</div>
      <div class="v">${n1(lv.points)}</div>
      <div class="s" title="The best ${pos} still available once every starting slot in the league is filled. VORP for a ${pos} is his points minus this.">${esc(lv.web_name || '–')} · ${lv.remaining_picks} picks left${lv.is_exhausted ? ' · <b>pool exhausted</b>' : ''}</div>
    </div>`));
  });
  if (S.board.draft) {
    wrap.append(el(`<div class="card">
      <div class="k">Draft</div>
      <div class="v">${S.board.draft.taken} taken</div>
      <div class="s">${S.board.draft.mine.length} mine · ${S.board.draft.managers} managers</div>
    </div>`));
  }
  return wrap;
}

function filterBar() {
  const bar = el('<div class="row"></div>');
  const posOptions = ['<option value="">all positions</option>']
    .concat(S.config.positions.map((p) => `<option ${S.filters.pos === p ? 'selected' : ''}>${p}</option>`)).join('');
  const teamOptions = ['<option value="">all clubs</option>']
    .concat(S.config.teams.map((t) => `<option ${S.filters.team === t ? 'selected' : ''}>${t}</option>`)).join('');
  const squadScopes = [
    ['all', 'all players'], ['mine', 'my squad'], ['others', 'not my squad'],
  ].map(([id, label]) =>
    `<option value="${id}" ${S.filters.squad === id ? 'selected' : ''}>${label}</option>`).join('');
  bar.innerHTML = `
    ${S.view === 'draft' ? '' : horizonFields()}
    ${S.view === 'draft' || !S.board.squad ? '' : `<span class="muted">${hint('squad_scope', 'show')}</span>
      <select id="fsquad">${squadScopes}</select>`}
    <input id="fq" placeholder="search name" value="${esc(S.filters.q)}" style="width:150px">
    <select id="fpos">${posOptions}</select>
    <select id="fteam">${teamOptions}</select>
    ${S.view === 'draft' ? `
      <label><input type="checkbox" id="flive" ${S.filters.live ? 'checked' : ''}> ${hint('live', 'live draft mode')}</label>
      <label><input type="checkbox" id="fhide" ${S.filters.hideTaken ? 'checked' : ''}> <span class="hint" title="Hides everyone already marked as taken. It only changes what you see — replacement level counts them either way.">hide taken</span></label>
      <button class="act" onclick="resetDraft()">reset picks</button>` : ''}
    <span class="spacer"></span>
    <span class="muted" id="count"></span>`;
  setTimeout(() => {
    wireHorizons(bar);
    bar.querySelector('#fq').oninput = (e) => { S.filters.q = e.target.value; redrawRows(); };
    bar.querySelector('#fpos').onchange = (e) => { S.filters.pos = e.target.value; redrawRows(); };
    bar.querySelector('#fteam').onchange = (e) => { S.filters.team = e.target.value; redrawRows(); };
    const live = bar.querySelector('#flive');
    if (live) live.onchange = (e) => { S.filters.live = e.target.checked; render(); };
    const hide = bar.querySelector('#fhide');
    if (hide) hide.onchange = (e) => { S.filters.hideTaken = e.target.checked; redrawRows(); };
    const squad = bar.querySelector('#fsquad');
    if (squad) squad.onchange = (e) => { S.filters.squad = e.target.value; redrawRows(); };
  });
  return bar;
}

function boardTable(cols) {
  const wrap = el('<div class="tablewrap"><table><thead><tr></tr></thead><tbody id="rows"></tbody></table></div>');
  const tr = wrap.querySelector('thead tr');
  cols.forEach(([key, label, help]) => {
    const horizon = horizonOf(key);
    const deciding = horizon && S.board && horizon === S.board.sort_horizon;
    const arrow = S.sort === key || (deciding && S.sort === 'rank') ? (S.desc ? ' ▾' : ' ▴') : '';
    const th = el(`<th data-k="${key}" style="${deciding ? 'color:var(--accent)' : ''}">`
      + hint(help || key, label) + arrow + '</th>');
    th.onclick = () => {
      if (horizon) {
        // Clicking a horizon decides on it, rather than sorting by one horizon while '#',
        // 'per GW' and 'pts/£' still answer another.
        S.sortHorizon = horizon;
        S.sort = 'rank';
        S.desc = true;
        render();
        return;
      }
      if (S.sort === key) S.desc = !S.desc; else { S.sort = key; S.desc = true; }
      renderBoard(document.getElementById('main'));
    };
    tr.append(th);
  });
  setTimeout(redrawRows);
  return wrap;
}

function visibleRows() {
  const f = S.filters;
  const q = f.q.trim().toLowerCase();
  return S.board.players.filter((row) =>
    (!f.pos || row.position === f.pos) &&
    (!f.team || row.team === f.team) &&
    (!q || row.web_name.toLowerCase().includes(q)) &&
    (!f.hideTaken || !row.owner) &&
    (f.squad === 'all' || (f.squad === 'mine') === Boolean(row.squad))
  );
}

function redrawRows() {
  const body = document.getElementById('rows');
  if (!body) return;
  const cols = boardCols();
  const rows = visibleRows();
  if (S.sort !== 'rank') {
    rows.sort((a, b) => {
      const x = cellValue(a, S.sort), y = cellValue(b, S.sort);
      if (typeof x === 'string') return S.desc ? y.localeCompare(x) : x.localeCompare(y);
      return S.desc ? (y ?? -1e9) - (x ?? -1e9) : (x ?? 1e9) - (y ?? 1e9);
    });
  }
  body.innerHTML = '';
  let lastTier = null;
  rows.forEach((row) => {
    const tierBreak = S.view === 'draft' && S.sort === 'rank' && row.tier && row.tier !== lastTier && lastTier !== null;
    lastTier = row.tier;
    const tr = el(`<tr class="${row.owner ? 'taken' : ''} ${row.owner === 'mine' || row.squad ? 'mine' : ''} ${tierBreak ? 'tierbreak' : ''}"></tr>`);
    cols.forEach(([key]) => tr.append(cell(row, key)));
    body.append(tr);
  });
  const count = document.getElementById('count');
  if (count) count.textContent = `${rows.length} of ${S.board.players.length} players`;
}

function cell(row, key) {
  const td = document.createElement('td');
  if (key === 'web_name') {
    td.innerHTML = `<span class="name">${esc(row.web_name)}</span>${squadChip(row)}${flagChips(row)}`;
    td.querySelector('.name').onclick = () => openPlayer(row.player_id);
    return td;
  }
  if (key === 'rank') {
    td.textContent = row.rank ?? '';
    if (S.view === 'draft') {
      td.style.cursor = 'pointer';
      td.title = 'Click to cycle: available → mine (✓) → taken by someone else (×) → available.\n'
        + 'In live draft mode either kind of pick raises replacement level and lowers VORP for '
        + 'everyone left in that position. "Mine" only adds the green bar — it changes no number.';
      td.onclick = () => cyclePick(row);
      if (row.owner) td.textContent = row.owner === 'mine' ? '✓' : '×';
    }
    return td;
  }
  if (key === 'position' || key === 'team') { td.textContent = row[key]; return td; }
  if (key === 'p_start' || key === 'dc_hit_rate') { td.textContent = pct(row[key]); return td; }
  if (key === 'dc_sample') { td.textContent = row[key]; return td; }
  const horizon = horizonOf(key);
  const value = cellValue(row, key);
  if (horizon) {
    td.textContent = n1(value);
    if (horizon === S.board.sort_horizon) td.style.color = 'var(--accent)';
    const blanks = row.horizon_blanks[horizon];
    if (blanks) td.title = `${blanks} of these ${horizon} gameweeks is a blank — his club does `
      + 'not play, so those weeks are zero, not missing.';
    return td;
  }
  td.textContent = key === 'ownership' || key === 'price' ? n1(value) : n2(value);
  if (key === 'vorp' && value != null) td.className = value >= 0 ? 'pos-good' : 'pos-bad';
  return td;
}

/** Where one of ours sat in the last team we submitted. Nothing for everyone else. */
function squadChip(row) {
  const pick = row.squad;
  if (!pick) return '';
  const gameweek = S.board.squad ? S.board.squad.gameweek : null;
  const label = pick.is_captain ? 'C' : pick.is_vice_captain ? 'V' : pick.is_bench ? 'bench' : 'XI';
  const where = pick.is_bench ? `on the bench, slot ${pick.slot}` : `in the eleven, slot ${pick.slot}`;
  const armband = pick.is_captain ? ', captain' : pick.is_vice_captain ? ', vice-captain' : '';
  return `<span class="flag" title="${esc(`Yours: ${where}${armband}, as at GW${gameweek}. ${helpText('squad_slot')}`)}">${label}</span>`;
}

const STATUS_MEANING = {
  d: 'a doubt — FPL flags him as not certain to play',
  i: 'injured', s: 'suspended', u: 'unavailable', n: 'not in the squad',
};

function flagChips(row) {
  return (row.flags || []).map((flag) => {
    const status = flag.startsWith('status_') ? flag.slice(7) : null;
    const unknown = status
      ? ['status ' + status, 'warn',
         `FPL availability flag "${status}": ${STATUS_MEANING[status] || 'not fully available'}. `
         + 'Expected minutes are reduced to match.']
      : [flag.replace(/_/g, ' '), 'warn', ''];
    const [label, kind, why] = FLAGS[flag] || unknown;
    return `<span class="flag ${kind}" title="${esc(why)}">${esc(label)}</span>`;
  }).join('');
}

async function cyclePick(row) {
  const next = { undefined: 'mine', null: 'mine', mine: 'other', other: null }[row.owner ?? 'null'];
  await post('/draft/pick', { player_id: row.player_id, owner: next });
  await renderBoard(document.getElementById('main'));
}

async function resetDraft() {
  if (!confirm('Clear every pick from the live draft board?')) return;
  await post('/draft/reset', {});
  await renderBoard(document.getElementById('main'));
}

function playerHeader(data) {

  const prior = p.prior_season;
  return el(`<div>

    <div class="muted">${n1(p.points)} projected points over GW${data.run.gameweek_from}–${data.run.gameweek_to}

function waterfall(p) {
  const entries = Object.entries(p.components).filter(([, v]) => Math.abs(v) > 0.005);
  const scale = Math.max(...entries.map(([, v]) => Math.abs(v)), 1);
  const rows = entries.sort((a, b) => Math.abs(b[1]) - Math.abs(a[1])).map(([name, value]) => `
    <tr><td>${hint(name, name.replace(/_/g, ' '))}</td>
      <td><div class="bar ${value < 0 ? 'neg' : ''}" style="width:${Math.abs(value) / scale * 100}%"></div></td>
      <td>${signed(value, 2)}</td>
      <td class="muted">${Math.round(value / p.points * 100)}%</td></tr>`).join('');
  return el(`<section class="block"><h3>Where the points come from</h3>
    <div class="muted" style="margin-bottom:4px">Every part of the FPL scoring rules, worked out
      separately and added up. Hover a name to see how it is calculated.</div>
    <table class="waterfall">${rows}
    <tr><td><b>total</b></td><td></td><td><b>${n1(p.points)}</b></td><td></td></tr></table></section>`);
}

/** Why the pre-season weight is what it is. Two independent reductions, so name the one that bites. */
function weightReason(m) {
  const reasons = [];
  if (m.moved) {
    reasons.push('flat weight because he changed club — pre-season is the only look at this squad');
  } else if (m.prior_start_share != null && m.prior_start_share >= 0.8) {
    reasons.push('low because last season says first choice, and a nailed player rests in pre-season');
  } else if (m.prior_start_share != null && m.prior_start_share < 0.3) {
    reasons.push('low because a fringe player\'s friendly starts say little about league starts');
  } else if (m.prior_start_share != null) {
    reasons.push('high because his place was open, so pre-season is the manager deciding it');
  }
  if (m.preseason_matches && m.preseason_matches <= 2) {
    reasons.push('and cut further because the club has thin evidence');
  }
  return reasons.length ? ', ' + reasons.join(', ') : '';
}

function inputsBlock(p) {
  const m = p.inputs.minutes, r = p.inputs.rates, d = p.inputs.defensive_contribution;
  const dc = d.threshold === 0
    ? '<dd>not available to goalkeepers</dd>'
    : `<dd>${pct(d.hit_rate)} per start
        <span class="muted">(observed ${d.observed_hit_rate == null ? 'n/a' : pct(d.observed_hit_rate)},
        rate implies ${pct(d.implied_hit_rate)}, ${hint('shrinkage', 'shrunk')} ${pct(1 - d.shrinkage_weight)} toward it,
        n=${d.starts} starts, ${n1(d.actions_per_start)} actions/start vs threshold ${d.threshold})</span></dd>`;
  return el(`<section class="block"><h3>Inputs, with their sample sizes</h3>
    <div class="muted" style="margin-bottom:6px">The numbers the parts above are built from.
      Sample sizes are shown next to each one because a rate from 3 matches and a rate from 30
      are not the same kind of number.</div><dl class="kv">
    <dt>${hint('p_start', 'p(start)')}</dt><dd>${pct(m.p_start)}
      <span class="muted">= ${hint('role_share', 'role')} ${pct(m.role_share)} × ${hint('availability', 'availability')} ${pct(m.availability)} (${esc(m.status_meaning)})</span></dd>
    <dt>${hint('preseason_weight', 'role from')}</dt><dd>${m.prior_start_share == null ? '<b>no prior season</b>' : 'last season ' + pct(m.prior_start_share)}
      ${m.transfer_multiplier != null && m.transfer_multiplier < 1
        ? `<span class="muted">× ${n2(m.transfer_multiplier)} ${hint('transfer_multiplier', 'transfer discount')}</span>` : ''}
      · ${m.preseason_start_share == null
        ? 'no pre-season matches stored'
        : `pre-season ${pct(m.preseason_start_share)} of ${m.preseason_matches} match(es)`}
      <span class="muted">— blended at ${pct(m.preseason_weight_used)} pre-season${
        weightReason(m)}</span></dd>
    <dt>${hint('expected_minutes', 'expected minutes')}</dt><dd>${n1(m.expected_minutes)}
      <span class="muted">(${n1(m.minutes_per_start)} per start, ${pct(m.full_match_rate)} reach 60', ${pct(m.cameo_rate)} cameo when benched, n=${m.sample_starts})</span></dd>
    <dt>${hint('defensive_contribution', 'defensive contribution')}</dt>${dc}
    <dt><span class="hint" title="Expected goals (xG) and expected assists (xA) per 90 minutes: the quality of the chances he gets and creates, which predicts future scoring better than goals already scored.">attacking rates</span></dt><dd>${n2(r.xg_per_90)} xG / ${n2(r.xa_per_90)} xA per 90
      ${r.sample_minutes === 0
        ? '<span class="muted">— <b>no Premier League minutes at all</b>: this is the position average scaled by the club\'s attack rating, a placeholder rather than a projection</span>'
        : `<span class="muted">(${hint('shrinkage', 'shrunk')} ${pct(1 - r.shrinkage_weight)} toward the position average, ${hint('sample_minutes', r.sample_minutes + ' minutes of evidence')})</span>`}</dd>
    <dt>${hint('bonus', 'bonus')}</dt><dd>${n2(r.bonus_per_90)} per 90</dd>
  </dl></section>`);
}

function fixturesBlock(p) {
  const rows = p.fixtures.map((f) => `<tr>
    <td>GW${f.gameweek}</td><td>${f.at_home ? 'v' : '@'} ${esc(f.opponent)}</td>
    <td>${pct(f.clean_sheet_probability)}</td><td>${n2(f.attack_multiplier)}</td><td>${n2(f.points)}</td></tr>`).join('');

function historyBlock(data) {
  if (!data.history.length) {
    return el('<section class="block"><h3>Per-match history</h3><div class="notice">No stored matches for this player.</div></section>');
  }
  const cells = data.history.map((m) => {
    const cls = !m.minutes ? 'cell dnp' : (m.defensive_hit ? 'cell hit' : (m.started ? 'cell' : 'cell sub'));
    const title = `${m.season} GW${m.gameweek} ${m.was_home ? 'v' : '@'} ${m.opponent} · ${m.minutes}' · `
      + `${m.points} pts · ${m.defensive_actions} def actions${m.defensive_hit ? ' (hit)' : ''}`;
    return `<div class="${cls}" title="${esc(title)}">${m.points}</div>`;
  }).join('');
  const coverage = Object.entries(data.history_coverage)
    .map(([season, range]) => `${season} GW${range[0]}–${range[1]}`).join(', ');
  const section = el(`<section class="block"><h3>Per-match history</h3>
    <div class="muted">Green = cleared the defensive threshold; dashed = came off the bench; faded = did not play.
      Numbers are points. Hover for detail.</div>
    <div class="strip">${cells}</div>
    <div class="muted">Coverage: ${esc(coverage)} — ${data.history.length} matches.</div></section>`);
  section.append(gameLog(data));
  return section;
}

const GAME_LOG_SHOWN = 12;

/** What actually happened, match by match. The strip shows the shape; this shows the games. */
function gameLog(data) {
  const played = data.history.slice().reverse();
  const rows = played.map((m, index) => {
    const result = m.team_score == null ? '–'
      : `${m.team_score}–${m.opponent_score} <span class="${m.team_score > m.opponent_score ? 'pos-good'
        : (m.team_score < m.opponent_score ? 'pos-bad' : 'muted')}">${
        m.team_score > m.opponent_score ? 'W' : (m.team_score < m.opponent_score ? 'L' : 'D')}</span>`;
    const how = !m.minutes ? '<span class="flag warn">out</span>'
      : (m.started ? '' : '<span class="flag">sub</span>');
    return `<tr class="${index >= GAME_LOG_SHOWN ? 'extra' : ''}"
      title="${esc(`BPS ${m.bps}` + (m.cards ? ` · ${m.cards} card(s)` : '')
        + (m.own_goals ? ` · ${m.own_goals} own goal(s)` : ''))}">
      <td>${esc(m.season.slice(2, 4))}/${esc(m.season.slice(7))} GW${m.gameweek}</td>
      <td>${m.was_home ? 'v' : '@'} ${esc(m.opponent)}</td>
      <td>${result}</td>
      <td>${m.minutes}′ ${how}</td>
      <td><b>${m.points}</b></td>
      <td>${m.goals || '·'}</td>
      <td>${m.assists || '·'}</td>
      <td>${m.clean_sheet ? '✓' : '·'}</td>
      <td>${m.goals_conceded || '·'}</td>
      <td class="${m.defensive_hit ? 'pos-good' : ''}">${m.defensive_actions}${m.defensive_hit ? ' ✓' : ''}</td>
      <td>${m.bonus || '·'}</td>
      <td>${n2(m.expected_goals)}</td>
      <td>${n2(m.expected_assists)}</td>
      <td>${n2(m.expected_goals_conceded)}</td></tr>`;
  }).join('');
  const wrap = el(`<div>
    <table class="gamelog">
      <thead><tr>
        <th><span class="hint" title="Season and gameweek. Newest first.">When</span></th>
        <th><span class="hint" title="v = at home, @ = away.">Opp</span></th>
        <th><span class="hint" title="His club's score first. The result of the match, not of his afternoon.">Score</span></th>
        <th><span class="hint" title="Minutes played. &quot;sub&quot; means he came off the bench, &quot;out&quot; that he did not play at all.">Min</span></th>
        <th><span class="hint" title="FPL points he actually scored in that match.">Pts</span></th>
        <th>G</th><th>A</th>
        <th><span class="hint" title="His club kept a clean sheet and he played 60 minutes or more.">CS</span></th>
        <th><span class="hint" title="Goals his club conceded while he was on the pitch. Costs a defender or keeper 1 point per 2.">GC</span></th>
        <th>${hint('defensive_contribution', 'DC')}</th>
        <th>${hint('bonus', 'B')}</th>
        <th>${hint('match_xg', 'xG')}</th>
        <th>${hint('match_xa', 'xA')}</th>
        <th>${hint('match_xgc', 'xGC')}</th>
      </tr></thead><tbody>${rows}</tbody></table></div>`);
  if (played.length > GAME_LOG_SHOWN) {
    const button = el(`<button class="act" style="margin-top:6px">show all ${played.length} matches</button>`);
    button.onclick = () => {
      const table = wrap.querySelector('.gamelog');
      const all = table.classList.toggle('showall');
      button.textContent = all ? `show the last ${GAME_LOG_SHOWN}` : `show all ${played.length} matches`;
    };
    wrap.append(button);
  }
  return wrap;
}

function feedbackForm(data) {
  const options = S.config.reasons.map((r) => `<option value="${r}">${r.replace(/_/g, ' ')}</option>`).join('');
  const existing = data.feedback.map((f) => `<li class="muted">${esc(f.created_at.slice(0, 16))} ·
    <b>${esc(f.reason)}</b> ${esc(f.note)}${f.your_p_start != null ? ' · your p_start ' + pct(f.your_p_start) : ''}</li>`).join('');
  const block = el(`<section class="block"><h3>Tell me what is wrong</h3>
    <div class="row">
      <select id="fbreason">${options}</select>
      <input id="fbp" placeholder="your p_start 0–1" style="width:135px">
    </div>
    <textarea id="fbnote" placeholder="why?"></textarea>
    <div class="row" style="margin-top:8px"><button class="act" id="fbsave">save feedback</button>
      <span id="fbmsg" class="muted"></span></div>
    ${existing ? `<ul style="padding-left:18px">${existing}</ul>` : ''}
  </section>`);
  setTimeout(() => {
    block.querySelector('#fbsave').onclick = async () => {
      const raw = block.querySelector('#fbp').value.trim();
      const msg = block.querySelector('#fbmsg');
      try {
        await post('/feedback', {
          run_id: data.run.run_id, game: data.run.game, player_id: data.player.player_id,
          reason: block.querySelector('#fbreason').value,
          note: block.querySelector('#fbnote').value,
          your_p_start: raw === '' ? null : Number(raw),
        });
        msg.textContent = 'saved';
        openPlayer(data.player.player_id);
      } catch (err) { msg.textContent = err.message; }
    };
  });
  return block;
}

/* -------------------------------------------------------------- compare */

async function renderCompare(main) {
  main.innerHTML = '';
  const runs = (await api('/runs?game=' + S.gameFor)).runs;
  if (runs.length < 2) {
    main.append(el(`<div class="notice"><b>Need two ${S.gameFor} runs to compare.</b><br>
      Try: <code>uv run -m src.fpl.project --game ${S.gameFor} --method v0-no-preseason</code></div>`));
    return;
  }
  S.cmpA = S.cmpA && runs.find((r) => r.run_id === S.cmpA) ? S.cmpA : runs[1].run_id;
  S.cmpB = S.cmpB && runs.find((r) => r.run_id === S.cmpB) ? S.cmpB : runs[0].run_id;
  const opts = (sel) => runs.map((r) =>
    `<option value="${r.run_id}" ${r.run_id === sel ? 'selected' : ''}>${esc(r.method)} · ${esc(r.created_at.slice(5, 16))}</option>`).join('');
  const bar = el(`<div class="row">
    <select id="cg"><option value="draft" ${S.gameFor === 'draft' ? 'selected' : ''}>draft</option>
      <option value="fpl" ${S.gameFor === 'fpl' ? 'selected' : ''}>fpl</option></select>
    baseline <select id="ca">${opts(S.cmpA)}</select>
    against <select id="cb">${opts(S.cmpB)}</select></div>`);
  main.append(bar);
  bar.querySelector('#cg').onchange = (e) => { S.gameFor = e.target.value; S.cmpA = S.cmpB = null; render(); };
  bar.querySelector('#ca').onchange = (e) => { S.cmpA = e.target.value; render(); };
  bar.querySelector('#cb').onchange = (e) => { S.cmpB = e.target.value; render(); };

  const d = await api(`/compare?game=${S.gameFor}&a=${encodeURIComponent(S.cmpA)}&b=${encodeURIComponent(S.cmpB)}`);
  const diff = Object.entries(d.param_diff);
  main.append(el(`<div class="notice" style="border-left-color:var(--accent)">
    <b>${esc(d.a.method.name)}</b> → <b>${esc(d.b.method.name)}</b> ·
    <span class="hint" title="Average number of places a player moved, counting every move as positive. A big number means the change reshuffled the board; a small one means it barely mattered.">mean absolute rank change</span> ${d.mean_abs_rank_delta} · ${d.unchanged} players unmoved<br>
    ${diff.length
      ? '<span class="muted">parameters changed: ' + diff.map(([k, v]) => `${esc(k)} ${esc(v.a)}→${esc(v.b)}`).join(', ') + '</span>'
      : '<span class="muted">identical parameters — any difference comes from the data snapshots</span>'}
  </div>`));

  const table = (title, entries) => {
    const rows = entries.map((e) => `<tr>
      <td class="name" onclick="openPlayer(${e.player_id})">${esc(e.web_name)}</td>
      <td>${esc(e.team)}</td><td>${esc(e.position)}</td>
      <td>${e.rank_a}</td><td>${e.rank_b}</td>
      <td class="${e.rank_delta > 0 ? 'pos-good' : 'pos-bad'}">${signed(e.rank_delta, 0)}</td>
      <td>${n1(e.points_a)}</td><td>${n1(e.points_b)}</td>
      <td class="${e.points_delta > 0 ? 'pos-good' : 'pos-bad'}">${signed(e.points_delta, 1)}</td></tr>`).join('');
    return el(`<section class="block"><h3>${title}</h3><div class="tablewrap"><table>
      <tr><th>${hint('web_name', 'Player')}</th><th>Club</th><th>${hint('position', 'Pos')}</th>
        <th><span class="hint" title="His place in the baseline run (A).">rank A</span></th>
        <th><span class="hint" title="His place in the run you are testing (B).">rank B</span></th>
        <th>${hint('rank_delta', 'Δrank')}</th>
        <th>pts A</th><th>pts B</th><th>${hint('points_delta', 'Δpts')}</th></tr>${rows}</table></div></section>`);
  };
  main.append(table('Biggest risers', d.risers));
  main.append(table('Biggest fallers', d.fallers));
}

/* ---------------------------------------------------------- calibration */

async function renderCalibration(main) {
  main.innerHTML = '';
  let path = `/calibration?game=${S.gameFor}`;
  if (S.runId) path += `&run_id=${encodeURIComponent(S.runId)}`;
  const d = await api(path);
  if (d.message) { main.append(el(`<div class="notice">${esc(d.message)}</div>`)); return; }
  main.append(el(`<div class="notice" style="border-left-color:var(--accent)">
    How well this run matched what actually happened, once gameweeks finished. Green means the
    model beat the baseline — the dumbest sensible guess. Losing to the baseline means the extra
    modelling is not earning its keep. <b>Lower is better everywhere on this page.</b></div>`));
  const cards = el('<div class="cards"></div>');
  const METRIC_HELP = { p_start: 'brier', points: 'mae' };
  Object.entries(d.components).forEach(([name, c]) => {
    const better = c.model != null && c.baseline != null && c.model < c.baseline;
    cards.append(el(`<div class="card">
      <div class="k">${hint(name, name)}</div>
      <div class="v ${better ? 'pos-good' : 'pos-bad'}">${n2(c.model)}</div>
      <div class="s"><span class="hint" title="What a model with no player knowledge would have scored. Beating it is the minimum bar.">baseline</span>
        ${n2(c.baseline)} — ${esc(c.baseline_description)}<br>${hint(METRIC_HELP[name], c.metric)}</div>
    </div>`));
  });
  main.append(cards);
  const rows = d.gameweeks.map((g) =>
    `<tr><td>GW${g.gameweek}</td><td>${g.players}</td><td>${n2(g.p_start_brier)}</td><td>${n2(g.points_mae)}</td></tr>`).join('');
  main.append(el(`<div class="tablewrap"><table>
    <tr><th>Gameweek</th><th><span class="hint" title="How many player-matches were scored in this gameweek.">Players</span></th>
      <th>${hint('brier', 'p_start Brier')}</th><th>${hint('mae', 'points MAE')}</th></tr>${rows}</table></div>`));
}
