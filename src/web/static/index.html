/* ------------------------------------------------------------- waivers */
/* In-season swaps. The draft board answers "who is worth most"; this answers "what would this
   free agent add to MY fifteen", which is a different number: a signing who would sit on the
   bench gains nothing, and the game only allows same-position swaps. */

function waiverSetup(detail) {
  return el(`<div class="notice err">
    <b>No draft league connected yet.</b><br>
    <span class="muted">${esc(detail)}</span><br><br>
    Your entry id is the number in the address of your team page on
    <code>draft.premierleague.com</code>. Then, from the repo:<br>
    <code>./run.sh -m src.fpl.league --entry &lt;your entry id&gt;</code><br><br>
    Run it again before every waiver deadline: ownership changes the moment someone else's
    claim clears, and this page will not guess.
  </div>`);
}

async function renderWaivers(main) {
  const w = S.waivers;
  if (!S.runId) {
    main.innerHTML = `<div class="notice"><b>No draft runs yet.</b><br>
      Generate one covering the gameweeks you want:
      <code>./run.sh -m src.fpl.project --game draft --gw-from ${S.config.next_gameweek}
      --gw-to ${S.config.next_gameweek + 9}</code></div>`;
    return;
  }
  let board;
  try {
    board = await api(`/waivers?run_id=${encodeURIComponent(S.runId)}`
      + `&horizons=${S.horizons.join(',')}&sort_horizon=${S.sortHorizon}`
      + `&include_locked=${w.includeLocked}`);
  } catch (err) {
    main.innerHTML = '';
    main.append(err.message.includes('src.fpl.league')
      ? waiverSetup(err.message)
      : el(`<div class="notice err"><b>${esc(err.message)}</b></div>`));
    main.append(waiverControls());
    return;
  }
  w.board = board;
  const head = board.run;

  main.innerHTML = '';
  main.append(el(`<div class="notice" style="border-left-color:var(--accent)">
    <b>${esc(board.league.league_name)}</b> · ${esc(board.league.transaction_mode)} ·
    ${board.league.entries.length} managers ·
    ownership fetched ${esc(board.league.fetched_at.replace('T', ' '))}<br>
    <span class="muted">${esc(head.method.name)} · projected GW${head.gameweek_from}–${head.gameweek_to} ·
    horizons start at GW${board.gameweek_from}.
    Refresh ownership with <code>./run.sh -m src.fpl.league --refresh</code></span>
  </div>`));
  if (board.gameweek_from !== board.next_gameweek) {
    main.append(el(`<div class="notice"><b>This run starts at GW${board.gameweek_from}, but the
      next gameweek is GW${board.next_gameweek}.</b> Every horizon below is counted from
      GW${board.gameweek_from}, so a "1 gameweek" number is about GW${board.gameweek_from}, not
      GW${board.next_gameweek}. Generate a run from the right gameweek:
      <code>./run.sh -m src.fpl.project --game draft --gw-from ${board.next_gameweek}
      --gw-to ${board.next_gameweek + 9}</code></div>`));
  }
  if (board.considered.unprojected) {
    main.append(el(`<div class="notice">${board.considered.unprojected} free agent(s) have no
      projection in this run and are not ranked — usually players added to the game since it was
      generated. Regenerate the run to include them.</div>`));
  }
  main.append(waiverCards());
  main.append(waiverControls());
  if (w.mode === 'players') {
    main.append(playerTable());
  } else {
    main.append(candidateTable());
    main.append(squadTable());
  }
}

function waiverCards() {
  const b = S.waivers.board;
  const wrap = el('<div class="cards"></div>');
  b.horizons.forEach((h) => {
    const on = h === b.sort_horizon;
    wrap.append(el(`<div class="card" style="${on ? 'border-color:var(--accent)' : ''}">
      <div class="k">${hint('squad_points', 'Squad, ' + h + ' GW')}</div>
      <div class="v">${n1(b.squad.points[h])}</div>
      <div class="s">GW${b.gameweek_from}–${b.gameweek_from + h - 1}${on ? ' · deciding' : ''}</div>
    </div>`));
  });
  const top = b.candidates[0];
  if (top && top.gain[b.sort_horizon] > 0) {
    wrap.append(el(`<div class="card">
      <div class="k">${hint('waiver_gain', 'Best claim')}</div>
      <div class="v pos-good">${esc(top.web_name)} ${signed(top.gain[b.sort_horizon])}</div>
      <div class="s">drop ${esc(top.out.web_name)} · over ${b.sort_horizon} GW</div>
    </div>`));
  } else {
    wrap.append(el(`<div class="card">
      <div class="k">${hint('waiver_gain', 'Best claim')}</div>
      <div class="v">none</div>
      <div class="s">no free agent improves this squad</div>
    </div>`));
  }
  const mine = b.league.entries.find((e) => e.is_mine);
  wrap.append(el(`<div class="card">
    <div class="k">${hint('waiver_pick', 'Your waiver order')}</div>
    <div class="v">${mine.waiver_pick == null ? '–' : mine.waiver_pick}</div>
    <div class="s">${b.considered.pool} in the pool · ${b.considered.improving} improve you
      ${b.considered.locked ? '· ' + b.considered.locked + ' locked' : ''}</div>
  </div>`));
  return wrap;
}

function waiverControls() {
  const w = S.waivers;
  const bar = el('<div class="row"></div>');
  const inputs = horizonInputs();
  const options = horizonOptions();
  const posOptions = ['<option value="">all positions</option>']
    .concat(S.config.positions.map((p) => `<option ${w.pos === p ? 'selected' : ''}>${p}</option>`)).join('');
  const scopes = [
    ['available', 'available to me'], ['mine', 'mine'], ['all', 'all players'], ['free', 'free agents'],
  ].map(([id, label]) =>
    `<option value="${id}" ${w.scope === id ? 'selected' : ''}>${label}</option>`).join('');
  bar.innerHTML = `
    <span class="modes">
      <button class="act ${w.mode === 'claims' ? 'on' : ''}" data-mode="claims"
        title="${esc(helpText('waiver_gain'))}">claims</button>
      <button class="act ${w.mode === 'players' ? 'on' : ''}" data-mode="players"
        title="${esc(helpText('player_list'))}">all players</button>
    </span>
    <span class="muted">${hint('horizon', 'horizons')}</span> ${inputs}
    <span class="muted">decide on</span> <select class="hsort">${options}</select>
    ${w.mode === 'players'
      ? `<span class="muted">${hint('owner_scope', 'show')}</span> <select id="wscope">${scopes}</select>`
      : ''}
    <select id="wpos">${posOptions}</select>
    <input id="wq" placeholder="search name" value="${esc(w.q)}" style="width:140px">
    ${w.mode === 'claims' ? `
      <label><input type="checkbox" id="wgain" ${w.onlyGains ? 'checked' : ''}>
        <span class="hint" title="Hides every free agent who would not improve your best eleven at the deciding horizon. In a settled league that is most of them.">only improvements</span></label>
      <label><input type="checkbox" id="wlock" ${w.includeLocked ? 'checked' : ''}>
        ${hint('claimable', 'show locked')}</label>` : ''}
    <span class="spacer"></span>
    <span class="muted" id="wcount"></span>`;
  setTimeout(() => {
    wireHorizons(bar);
    const redraw = () => (w.mode === 'players' ? redrawPlayers() : redrawCandidates());
    bar.querySelectorAll('[data-mode]').forEach((button) => {
      button.onclick = () => { w.mode = button.dataset.mode; render(); };
    });
    bar.querySelector('#wpos').onchange = (e) => { w.pos = e.target.value; redraw(); };
    bar.querySelector('#wq').oninput = (e) => { w.q = e.target.value; redraw(); };
    const scope = bar.querySelector('#wscope');
    if (scope) scope.onchange = (e) => { w.scope = e.target.value; redrawPlayers(); };
    const gain = bar.querySelector('#wgain');
    if (gain) gain.onchange = (e) => { w.onlyGains = e.target.checked; redrawCandidates(); };
    const lock = bar.querySelector('#wlock');
    if (lock) lock.onchange = (e) => { w.includeLocked = e.target.checked; render(); };
  });
  return bar;
}

function candidateCols() {
  const b = S.waivers.board;
  const cols = [
    ['rank', '#', 'rank'], ['web_name', 'Sign', 'web_name'], ['team', 'Club', 'team'],
    ['position', 'Pos', 'position'], ['p_start', 'Start%', 'p_start'],
    ['own_points', `pts ${b.sort_horizon} GW`, 'points'],
  ];
  b.horizons.forEach((h) => cols.push([`gain${h}`, `+${h} GW`, 'waiver_gain']));
  cols.push(['out', 'Drop', 'waiver_out'], ['out_starts', 'drop starts', 'starts'],
            ['claimable', 'Status', 'claimable']);
  return cols;
}

function candidateTable() {
  const wrap = el('<div class="tablewrap"><table><thead><tr></tr></thead><tbody id="wrows"></tbody></table></div>');
  const tr = wrap.querySelector('thead tr');
  const b = S.waivers.board;
  candidateCols().forEach(([key, label, helpKey]) => {
    const isSort = key === 'gain' + b.sort_horizon;
    const th = el(`<th data-k="${key}" style="${isSort ? 'color:var(--accent)' : ''}">`
      + hint(helpKey, label) + (S.waivers.sort === key ? (S.waivers.desc ? ' ▾' : ' ▴') : '') + '</th>');
    th.onclick = () => {
      const horizon = key.startsWith('gain') ? Number(key.slice(4)) : null;
      if (horizon && horizon !== b.sort_horizon) {
        // The drop suggested next to each player is the best one *at the deciding horizon*, so
        // changing which horizon decides has to be re-asked of the server, not re-sorted here.
        S.sortHorizon = horizon;
        render();
        return;
      }
      if (S.waivers.sort === key) S.waivers.desc = !S.waivers.desc;
      else { S.waivers.sort = key; S.waivers.desc = true; }
      redrawCandidates();
    };
    tr.append(th);
  });
  setTimeout(redrawCandidates);
  return wrap;
}

const candidateValue = (row, key) => {
  if (key.startsWith('gain')) return row.gain[Number(key.slice(4))];
  if (key === 'own_points') return row.points[S.waivers.board.sort_horizon];
  if (key === 'out_starts') return row.out.starts[S.waivers.board.sort_horizon];
  if (key === 'out') return row.out.web_name;
  if (key === 'claimable') return row.claimable ? 1 : 0;
  return row[key];
};

function redrawCandidates() {
  const body = document.getElementById('wrows');
  if (!body) return;
  const w = S.waivers;
  const b = w.board;
  const query = w.q.trim().toLowerCase();
  const rows = b.candidates.filter((row) =>
    (!w.pos || row.position === w.pos)
    && (!w.onlyGains || row.gain[b.sort_horizon] > 0)
    && (!query || row.web_name.toLowerCase().includes(query)));
  if (w.sort !== 'rank') {
    rows.sort((a, c) => {
      const x = candidateValue(a, w.sort), y = candidateValue(c, w.sort);
      if (typeof x === 'string') return w.desc ? y.localeCompare(x) : x.localeCompare(y);
      return w.desc ? (y ?? -1e9) - (x ?? -1e9) : (x ?? 1e9) - (y ?? 1e9);
    });
  }
  body.innerHTML = '';
  rows.forEach((row) => {
    const tr = el(`<tr class="${row.claimable ? '' : 'taken'}"></tr>`);
    candidateCols().forEach(([key]) => {
      const td = document.createElement('td');
      if (key === 'web_name') {
        td.innerHTML = `<span class="name">${esc(row.web_name)}</span>${flagChips(row)}`;
        td.querySelector('.name').onclick = () => openPlayer(row.player_id);
      } else if (key === 'out') {
        td.innerHTML = `<span class="name">${esc(row.out.web_name)}</span>`;
        td.querySelector('.name').onclick = () => openPlayer(row.out.player_id);
      } else if (key.startsWith('gain')) {
        const value = row.gain[Number(key.slice(4))];
        td.textContent = signed(value);
        td.className = value > 0.05 ? 'pos-good' : (value < -0.05 ? 'pos-bad' : 'muted');
      } else if (key === 'p_start') {
        td.textContent = pct(row.p_start);
      } else if (key === 'claimable') {
        td.innerHTML = row.claimable
          ? '<span class="flag good">free</span>'
          : `<span class="flag warn" title="${esc(helpText('claimable'))}">locked</span>`;
      } else if (key === 'out_starts') {
        td.textContent = `${row.out.starts[b.sort_horizon]} of ${b.sort_horizon}`;
      } else if (key === 'rank' || key === 'team' || key === 'position') {
        td.textContent = row[key];
      } else {
        td.textContent = n1(candidateValue(row, key));
      }
      tr.append(td);
    });
    body.append(tr);
  });
  const count = document.getElementById('wcount');
  if (count) {
    count.textContent = `${rows.length} shown of ${b.considered.ranked} ranked`
      + ` · ${b.considered.improving} improve the squad`;
  }
}

/* The plain board: every player, his points at each horizon, and who holds him. Ranked by
   points rather than by swap gain, because this is the view you pick a team from. */

const OWNER_KIND = {
  mine: ['yours', 'good'],
  free: ['free', 'good'],
  locked: ['locked', 'warn'],
  rival: ['taken', ''],
  unknown: ['owner unknown', 'warn'],
};

function playerCols() {
  const b = S.waivers.board;
  const cols = [
    ['rank', '#', 'rank'], ['web_name', 'Player', 'web_name'], ['team', 'Club', 'team'],
    ['position', 'Pos', 'position'], ['p_start', 'Start%', 'p_start'],
  ];
  b.horizons.forEach((h) => cols.push([`points${h}`, `${h} GW`, 'points']));
  cols.push(['starts', 'starts', 'starts'], ['owner_kind', 'Owner', 'ownership_label']);
  return cols;
}

const playerValue = (row, key) => {
  if (key.startsWith('points')) return row.points[Number(key.slice(6))];
  if (key === 'points') return row.points[S.waivers.board.sort_horizon];
  if (key === 'starts') return row.starts ? row.starts[S.waivers.board.sort_horizon] : -1;
  if (key === 'owner_kind') return row.ownership;
  return row[key];
};

const inScope = (row, scope) => (
  scope === 'all' ? true
    : scope === 'mine' ? row.owner_kind === 'mine'
    : scope === 'free' ? row.owner_kind === 'free'
    : row.owner_kind === 'mine' || row.owner_kind === 'free'
);

function playerTable() {
  const b = S.waivers.board;
  const wrap = el('<div class="tablewrap"><table><thead><tr></tr></thead><tbody id="prows"></tbody></table></div>');
  const tr = wrap.querySelector('thead tr');
  playerCols().forEach(([key, label, helpKey]) => {
    const isSort = key === 'points' + b.sort_horizon;
    const th = el(`<th data-k="${key}" style="${isSort ? 'color:var(--accent)' : ''}">`
      + hint(helpKey, label)
      + (S.waivers.psort === key ? (S.waivers.pdesc ? ' ▾' : ' ▴') : '') + '</th>');
    th.onclick = () => {
      if (S.waivers.psort === key) S.waivers.pdesc = !S.waivers.pdesc;
      else { S.waivers.psort = key; S.waivers.pdesc = true; }
      redrawPlayers();
    };
    tr.append(th);
  });
  setTimeout(redrawPlayers);
  return wrap;
}

function redrawPlayers() {
  const body = document.getElementById('prows');
  if (!body) return;
  const w = S.waivers;
  const b = w.board;
  const query = w.q.trim().toLowerCase();
  const rows = b.players.filter((row) =>
    inScope(row, w.scope)
    && (!w.pos || row.position === w.pos)
    && (!query || row.web_name.toLowerCase().includes(query)));
  // Default sort is the deciding horizon, so the key has to resolve to it rather than to a
  // column that only exists in the claims table.
  const key = w.psort === 'points' ? 'points' + b.sort_horizon : w.psort;
  rows.sort((a, c) => {
    const x = playerValue(a, key), y = playerValue(c, key);
    if (typeof x === 'string') return w.pdesc ? y.localeCompare(x) : x.localeCompare(y);
    return w.pdesc ? (y ?? -1e9) - (x ?? -1e9) : (x ?? 1e9) - (y ?? 1e9);
  });
  body.innerHTML = '';
  rows.forEach((row, index) => {
    const tr = el(`<tr class="${row.owner_kind === 'rival' ? 'taken' : ''} ${row.owner_kind === 'mine' ? 'mine' : ''}"></tr>`);
    playerCols().forEach(([col]) => {
      const td = document.createElement('td');
      if (col === 'rank') {
        td.textContent = index + 1;
      } else if (col === 'web_name') {
        td.innerHTML = `<span class="name">${esc(row.web_name)}</span>${flagChips(row)}`;
        td.querySelector('.name').onclick = () => openPlayer(row.player_id);
      } else if (col === 'p_start') {
        td.textContent = pct(row.p_start);
      } else if (col === 'starts') {
        td.textContent = row.starts ? `${row.starts[b.sort_horizon]} of ${b.sort_horizon}` : '–';
      } else if (col === 'owner_kind') {
        const [label, kind] = OWNER_KIND[row.owner_kind] || [row.owner_kind, ''];
        td.innerHTML = `<span class="flag ${kind}" title="${esc(row.ownership)}">${esc(label)}</span>`;
      } else if (col === 'team' || col === 'position') {
        td.textContent = row[col];
      } else {
        td.textContent = n1(playerValue(row, col));
      }
      tr.append(td);
    });
    body.append(tr);
  });
  const count = document.getElementById('wcount');
  if (count) {
    const mine = rows.filter((row) => row.owner_kind === 'mine').length;
    count.textContent = `${rows.length} of ${b.players.length} players`
      + (mine ? ` · ${mine} yours` : '');
  }
}

function squadTable() {
  const b = S.waivers.board;
  const head = b.horizons.map((h) => `<th>${hint('points', h + ' GW')}</th>`).join('');
  const rows = b.squad.players.map((p) => `<tr>
    <td>${esc(p.position)}</td>
    <td><span class="name" onclick="openPlayer(${p.player_id})">${esc(p.web_name)}</span>${flagChips(p)}</td>
    <td>${esc(p.team)}</td>
    <td>${pct(p.p_start)}</td>
    ${b.horizons.map((h) => `<td>${n1(p.points[h])}</td>`).join('')}
    <td>${p.starts[b.sort_horizon]} of ${b.sort_horizon}</td>
    <td>${p.blanks[b.sort_horizon] || '–'}</td></tr>`).join('');
  const section = el(`<section class="block"><h3>Your squad, and who is only cover</h3>
    <div class="tablewrap" style="max-height:none">
      <table><thead><tr><th>Pos</th><th>${hint('web_name', 'Player')}</th><th>Club</th>
        <th>${hint('p_start', 'Start%')}</th>${head}
        <th>${hint('starts', 'starts')}</th><th>${hint('blanks', 'blanks')}</th></tr></thead>
      <tbody>${rows}</tbody></table></div></section>`);
  return section;
}

/* ----------------------------------------------------------- transfers */

/* The classic-FPL counterpart of the waivers page. Same metric - best legal XI before and after
   the swap - narrowed by a budget, a three-per-club cap and the 4-point hit. The hit is why this
   screen leads with `net` rather than `gain`: most rows here are worth less than four points. */

async function renderTransfers(main) {
  const t = S.transfers;
  if (!S.runId) {
    main.innerHTML = `<div class="notice"><b>No FPL runs yet.</b><br>
      Generate one: <code>./run.sh -m src.fpl.project --game fpl</code></div>`;
    return;
  }
  let board;
  try {
    board = await api(`/transfers?run_id=${encodeURIComponent(S.runId)}`
      + `&horizons=${S.horizons.join(',')}&sort_horizon=${S.sortHorizon}`
      + `&free_transfers=${t.freeTransfers}`);
  } catch (err) {
    main.innerHTML = '';
    main.append(el(`<div class="notice err"><b>${esc(err.message)}</b></div>`));
    return;
  }
  t.board = board;
  const head = board.run;

  main.innerHTML = '';
  main.append(el(`<div class="notice" style="border-left-color:var(--accent)">
    <b>${esc(board.squad.entry_name)}</b> (${esc(board.squad.manager)}) ·
    squad as at GW${board.squad.gameweek}${board.squad.active_chip ? ' · chip ' + esc(board.squad.active_chip) : ''} ·
    bank £${n1(board.budget.bank)}m · value £${n1(board.budget.squad_value)}m<br>
    <span class="muted">${esc(head.method.name)} · projected GW${head.gameweek_from}–${head.gameweek_to} ·
    horizons start at GW${board.gameweek_from}.
    Refresh picks with <code>./run.sh -m src.fpl.squad --refresh</code></span>
  </div>`));

  /* Two caveats that change what the table means, so neither is buried in a tooltip. */
  main.append(el(`<div class="notice"><b>Your squad is GW${board.squad.gameweek}'s, and selling
    prices are approximate.</b> FPL publishes an entry's picks only after the deadline, so a
    transfer you have already made for GW${board.next_gameweek} is not visible here. And the public
    API does not publish what you paid for a player, so every budget below uses his
    <em>current</em> price — a player who has risen sells for less than that, making these budgets
    an upper bound.</div>`));

  if (board.gameweek_from !== board.next_gameweek) {
    main.append(el(`<div class="notice"><b>This run starts at GW${board.gameweek_from}, but the
      next gameweek is GW${board.next_gameweek}.</b> Every horizon below is counted from
      GW${board.gameweek_from}. Generate a run from the right gameweek:
      <code>./run.sh -m src.fpl.project --game fpl</code></div>`));
  }
  main.append(transferCards());
  main.append(transferControls());
  main.append(transferTable());
  main.append(transferSquadTable());
}

function transferCards() {
  const b = S.transfers.board;
  const wrap = el('<div class="cards"></div>');
  b.horizons.forEach((h) => {
    const on = h === b.sort_horizon;
    wrap.append(el(`<div class="card" style="${on ? 'border-color:var(--accent)' : ''}">
      <div class="k">${hint('squad_points', 'Squad, ' + h + ' GW')}</div>
      <div class="v">${n1(b.squad.points[h])}</div>
      <div class="s">GW${b.gameweek_from}–${b.gameweek_from + h - 1}${on ? ' · deciding' : ''}</div>
    </div>`));
  });
  const top = b.candidates[0];
  if (top) {
    const net = top.net[b.sort_horizon];
    wrap.append(el(`<div class="card">
      <div class="k">${hint('transfer_gain', 'Best transfer')}</div>
      <div class="v ${net > 0 ? 'pos-good' : ''}">${esc(top.web_name)} ${signed(top.gain[b.sort_horizon])}</div>
      <div class="s">sell ${esc(top.out.web_name)} · net ${signed(net)} over ${b.sort_horizon} GW</div>
    </div>`));
  } else {
    wrap.append(el(`<div class="card">
      <div class="k">${hint('transfer_gain', 'Best transfer')}</div>
      <div class="v">none</div>
      <div class="s">nothing affordable improves this squad</div>
    </div>`));
  }
  wrap.append(el(`<div class="card">
    <div class="k">${hint('transfer_budget', 'Bank')}</div>
    <div class="v">£${n1(b.budget.bank)}m</div>
    <div class="s">${b.considered.improving} of ${b.considered.scored} legal swaps improve you</div>
  </div>`));
  return wrap;
}

function transferControls() {
  const t = S.transfers;
  const bar = el('<div class="row"></div>');
  const posOptions = ['<option value="">all positions</option>']
    .concat(S.config.positions.map((p) => `<option ${t.pos === p ? 'selected' : ''}>${p}</option>`)).join('');
  bar.innerHTML = `
    <span class="muted">${hint('horizon', 'horizons')}</span> ${horizonInputs()}
    <span class="muted">decide on</span> <select class="hsort">${horizonOptions()}</select>
    <span class="muted">${hint('free_transfers', 'free transfers')}</span>
    <input id="tft" type="number" min="0" max="5" value="${t.freeTransfers}" style="width:56px">
    <select id="tpos">${posOptions}</select>
    <input id="tq" placeholder="search name" value="${esc(t.q)}" style="width:140px">
    <label><input type="checkbox" id="tnet" ${t.onlyWorthHit ? 'checked' : ''}>
      <span class="hint" title="Hides every transfer whose net gain is not positive — that is, the ones a hit would wipe out. With a free transfer in hand this changes nothing.">only worth taking</span></label>
    <span class="spacer"></span>
    <span class="muted" id="tcount"></span>`;
  setTimeout(() => {
    wireHorizons(bar);
    bar.querySelector('#tpos').onchange = (e) => { t.pos = e.target.value; redrawTransfers(); };
    bar.querySelector('#tq').oninput = (e) => { t.q = e.target.value; redrawTransfers(); };
    bar.querySelector('#tnet').onchange = (e) => { t.onlyWorthHit = e.target.checked; redrawTransfers(); };
    // Free transfers change the hit arithmetic on the server, so this is a refetch, not a resort.
    bar.querySelector('#tft').onchange = (e) => {
      t.freeTransfers = Math.max(0, Number(e.target.value) || 0);
      render();
    };
  });
  return bar;
}

function transferCols() {
  const b = S.transfers.board;
  const cols = [
    ['rank', '#', 'rank'], ['web_name', 'Buy', 'web_name'], ['team', 'Club', 'team'],
    ['position', 'Pos', 'position'], ['p_start', 'Start%', 'p_start'], ['price', '£', 'price'],
  ];
  b.horizons.forEach((h) => cols.push([`gain${h}`, `+${h} GW`, 'transfer_gain']));
  cols.push([`net${b.sort_horizon}`, `net ${b.sort_horizon} GW`, 'transfer_net']);
  cols.push(['out', 'Sell', 'transfer_out'], ['out_price', 'sell £', 'price'],
            ['out_starts', 'sell starts', 'starts'], ['spare', 'Spare', 'transfer_spare']);
  return cols;
}

const transferValue = (row, key) => {
  if (key.startsWith('gain')) return row.gain[Number(key.slice(4))];
  if (key.startsWith('net')) return row.net[Number(key.slice(3))];
  if (key === 'out') return row.out.web_name;
  if (key === 'out_price') return row.out.price;
  if (key === 'out_starts') return row.out.starts[S.transfers.board.sort_horizon];
  return row[key];
};

function transferTable() {
  const wrap = el('<div class="tablewrap"><table><thead><tr></tr></thead><tbody id="trows"></tbody></table></div>');
  const tr = wrap.querySelector('thead tr');
  const b = S.transfers.board;
  transferCols().forEach(([key, label, helpKey]) => {
    const isSort = key === 'gain' + b.sort_horizon;
    const th = el(`<th data-k="${key}" style="${isSort ? 'color:var(--accent)' : ''}">`
      + hint(helpKey, label) + (S.transfers.sort === key ? (S.transfers.desc ? ' ▾' : ' ▴') : '') + '</th>');
    th.onclick = () => {
      const horizon = key.startsWith('gain') ? Number(key.slice(4)) : null;
      if (horizon && horizon !== b.sort_horizon) {
        // The player to sell is chosen at the deciding horizon, so changing it is a server
        // question rather than a re-sort - exactly as on the waivers page.
        S.sortHorizon = horizon;
        render();
        return;
      }
      if (S.transfers.sort === key) S.transfers.desc = !S.transfers.desc;
      else { S.transfers.sort = key; S.transfers.desc = true; }
      redrawTransfers();
    };
    tr.append(th);
  });
  setTimeout(redrawTransfers);
  return wrap;
}

function redrawTransfers() {
  const body = document.getElementById('trows');
  if (!body) return;
  const t = S.transfers;
  const b = t.board;
  const query = t.q.trim().toLowerCase();
  const rows = b.candidates.filter((row) =>
    (!t.pos || row.position === t.pos)
    && (!t.onlyWorthHit || row.net[b.sort_horizon] > 0)
    && (!query || row.web_name.toLowerCase().includes(query)));
  if (t.sort !== 'rank') {
    rows.sort((a, c) => {
      const x = transferValue(a, t.sort), y = transferValue(c, t.sort);
      if (typeof x === 'string') return t.desc ? y.localeCompare(x) : x.localeCompare(y);
      return t.desc ? (y ?? -1e9) - (x ?? -1e9) : (x ?? 1e9) - (y ?? 1e9);
    });
  }
  body.innerHTML = '';
  rows.forEach((row) => {
    const tr = el('<tr></tr>');
    transferCols().forEach(([key]) => {
      const td = document.createElement('td');
      if (key === 'web_name') {
        td.innerHTML = `<span class="name">${esc(row.web_name)}</span>${flagChips(row)}`;
        td.querySelector('.name').onclick = () => openPlayer(row.player_id);
      } else if (key === 'out') {
        td.innerHTML = `<span class="name">${esc(row.out.web_name)}</span>`;
        td.querySelector('.name').onclick = () => openPlayer(row.out.player_id);
      } else if (key.startsWith('gain') || key.startsWith('net')) {
        const value = transferValue(row, key);
        td.textContent = signed(value);
        td.className = value > 0.05 ? 'pos-good' : (value < -0.05 ? 'pos-bad' : 'muted');
      } else if (key === 'p_start') {
        td.textContent = pct(row.p_start);
      } else if (key === 'out_starts') {
        td.textContent = `${row.out.starts[b.sort_horizon]} of ${b.sort_horizon}`;
      } else if (key === 'price' || key === 'out_price' || key === 'spare') {
        td.textContent = n1(transferValue(row, key));
      } else if (key === 'rank' || key === 'team' || key === 'position') {
        td.textContent = row[key];
      } else {
        td.textContent = n1(transferValue(row, key));
      }
      tr.append(td);
    });
    body.append(tr);
  });
  const count = document.getElementById('tcount');
  if (count) {
    count.textContent = `${rows.length} shown of ${b.considered.improving} improving`
      + ` · ${b.considered.scored} legal swaps priced`;
  }
}

/* Your fifteen, so the sell side of every row above can be checked against the squad it comes
   from. `starts` is the column that explains a near-zero gain: a player who never makes the XI
   cannot be upgraded profitably. */

function transferSquadTable() {
  const b = S.transfers.board;
  const wrap = el('<div class="tablewrap"><table><thead><tr>'
    + '<th>Pos</th><th>Player</th><th>Club</th><th>£</th><th>Start%</th>'
    + b.horizons.map((h) => `<th>pts ${h} GW</th>`).join('')
    + `<th>${hint('starts', 'starts')}</th><th>Status</th>`
    + '</tr></thead><tbody></tbody></table></div>');
  const body = wrap.querySelector('tbody');
  const order = { GKP: 0, DEF: 1, MID: 2, FWD: 3 };
  [...b.squad.players]
    .sort((a, c) => (order[a.position] - order[c.position])
      || (c.points[b.sort_horizon] - a.points[b.sort_horizon]))
    .forEach((row) => {
      const tr = el('<tr></tr>');
      tr.innerHTML = `<td>${row.position}</td>`
        + `<td><span class="name">${esc(row.web_name)}</span>${flagChips(row)}</td>`
        + `<td>${esc(row.team)}</td><td>${n1(row.price)}</td><td>${pct(row.p_start)}</td>`
        + b.horizons.map((h) => `<td>${n1(row.points[h])}</td>`).join('')
        + `<td>${row.starts[b.sort_horizon]} of ${b.sort_horizon}</td>`
        + `<td class="muted">${esc(row.status_meaning)}</td>`;
      tr.querySelector('.name').onclick = () => openPlayer(row.player_id);
      body.append(tr);
    });
  return wrap;
}

function renderGlossary(main) {
  main.innerHTML = '';
  main.append(el(`<div class="notice" style="border-left-color:var(--accent)">
    Every column and every number in one place. The same text appears when you hover any
    <span class="hint" title="Like this one.">dotted label</span> in the app.</div>`));
  GLOSSARY_GROUPS.forEach(([title, keys]) => {
    const rows = keys.map((key) =>
      `<dt>${esc(HELP[key][0])}</dt><dd>${esc(HELP[key][1])}</dd>`).join('');
    main.append(el(`<section class="block"><h3>${esc(title)}</h3>
      <dl class="glossary">${rows}</dl></section>`));
  });
  const flags = Object.values(FLAGS)
    .map(([label, kind, why]) => `<dt><span class="flag ${kind}">${esc(label)}</span></dt><dd>${esc(why)}</dd>`)
    .join('');
  main.append(el(`<section class="block"><h3>Flags next to a player's name</h3>
    <dl class="glossary">${flags}
      <dt><span class="flag warn">status …</span></dt>
      <dd>FPL's own availability flag: i injured, d a doubt, s suspended, u unavailable,
        n not in the squad. Expected minutes are reduced to match.</dd></dl></section>`));
}

/* ----------------------------------------------------------------- boot */

(async function boot() {
  S.config = await api('/config');
  const hash = location.hash.replace('#/', '');
  if (VIEWS.some(([id]) => id === hash)) S.view = hash;
  window.onhashchange = () => {
    const view = location.hash.replace('#/', '');
    if (view && view !== S.view && VIEWS.some(([id]) => id === view)) { S.view = view; render(); }
  };
  document.onkeydown = (e) => { if (e.key === 'Escape') closePanel(); };
  render();
})();
</script>
